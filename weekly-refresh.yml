name: Weekly Price Refresh

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vinyl Hunter refresh endpoint
        run: |
          curl -X POST https://vinyl-hunter.onrender.com/refresh \
            --max-time 300 \
            --retry 3 \
            --retry-delay 30 \
            -f
